<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentarios</title>
</head>
 
<body bgcolor="#db7790">
 
<font face="Comic Sans MS" color="#1b548d" size="5">
 
<h2 align="center">Mural de Comentários</h2>
<h4 align="center"><i>Deixe o seu comentário ou homenagem abaixo!</i></h4>
 
<hr color="#1b548d">
 
<!-- Formulário -->
<form align="center" id="formMural" onsubmit="enviarMensagem(event)">
<table border="1" bordercolor="#4a0e17" bgcolor="#0d0d0d" align="center" cellpadding="10" cellspacing="0">
<tr>
<td align="right"><b>Seu Nome / Apelido:</b></td>
<td align="left">
<input type="text" id="nome" size="30" placeholder="Insira seu nome aqui..." required>
</td>
</tr>
 
<tr>
<td align="right" valign="top"><b>Seu comentário:</b></font></td>
<td align="left">
<textarea id="mensagem" rows="5" cols="33" placeholder="Escreva aqui o seu comentário..." required></textarea>
</td>
</tr>
 
    <tr>
<td colspan="2" align="center">
<input type="submit" value="Enviar Comentário" id="btnEnviar">
<input type="reset" value="Limpar">
</td>
</tr>
</table>
</form>
 
<hr color="#1b548d">
 
<h3 align="center">Últimos Comentários></h3>
 
<!-- Área onde as mensagens públicas vão aparecer -->
<div id="listaComentarios"></div>
 
<hr color="#1b548d">
 
</font>
 
<script>

  // COLOQUE A SUA URL DO SHEETBEST AQUI:

  var apiURL = "https://api.sheetbest.com/sheets/a6dd0bcb-d3bb-4d66-9831-49d7ee145c06";
 
  // Busca e exibe as mensagens da planilha

  function buscarMensagens() {

    var container = document.getElementById("listaComentarios");

    container.innerHTML = '<p align="center"><font size="4"><i>Carregando comentários...</i></font></p>';
 
    fetch(apiURL)

      .then(response => response.json())

      .then(data => {

        container.innerHTML = "";

        if (!data || data.length === 0) {

          container.innerHTML = '<p align="center"><font size="4"><i>Nenhuma mensagem enviada ainda... Seja o primeiro!</i></font></p>';

          return;

        }
 
        // Mostra as mensagens mais recentes no topo (ordem reversa)

        data.reverse().forEach(function(m) {

          var tabela = `
<table border="1" bordercolor="#889399" bgcolor="#0d0d0d" align="center" width="60%" cellpadding="8">
<tr>
<td>
<b>De:</b> ${m.nome}
<hr color="#1b548d">

                    "${m.mensagem}"
</td>
</tr>
</table><br>

          `;

          container.innerHTML += tabela;

        });

      })

      .catch(err => {

        container.innerHTML = '<p align="center"><font color="red">Erro ao carregar os comentários. Tente novamente mais tarde.</font></p>';

      });

  }
 
  // Envia a nova mensagem para o Google Sheets

  function enviarMensagem(event) {

    event.preventDefault();
 
    var btn = document.getElementById("btnEnviar");

    btn.value = "Enviando...";

    btn.disabled = true;
 
    var dados = {

      nome: document.getElementById("nome").value,

      comentarios: document.getElementById("comentarios").value

    };
 
    fetch(apiURL, {

      method: "POST",

      headers: {

        "Content-Type": "application/json"

      },

      body: JSON.stringify(dados)

    })

    .then(response => response.json())

    .then(() => {

      document.getElementById("formMural").reset();

      btn.value = "Enviar comentário";

      btn.disabled = false;

      buscarMensagens(); // Atualiza o mural imediatamente!

    })

    .catch(err => {

      alert("Houve um erro ao salvar seu comentário.");

      btn.value = "Enviar comentário";

      btn.disabled = false;

    });

  }
 
  // Carrega ao abrir a página

  window.onload = buscarMensagens;

</script>

</body>
</html>
